name: Refresh 10X Screener Data

on:
  schedule:
    # Sundays at 06:00 UTC — after US markets close Friday, before Monday open.
    - cron: '0 6 * * 0'
  workflow_dispatch:
    inputs:
      max_tickers:
        description: 'Cap on tickers probed per run (FMP free tier = 250 calls/day)'
        required: false
        default: '80'
  push:
    branches:
      - claude/stock-research-tool-3uasA
      - main
    paths:
      - 'scripts/build-candidates.mjs'
      - '.github/workflows/update-stock-data.yml'

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build candidates.json
        env:
          # Free-tier FMP key, embedded per user instruction ("I don't care,
          # it's free"). Rotate at site.financialmodelingprep.com/developer
          # and prefer `secrets.FMP_API_KEY` once rotated — the fallback below
          # will still work until the secret overrides it.
          FMP_API_KEY: ${{ secrets.FMP_API_KEY || 'LmlFjxcn99cBn3mQiEH3mD56nW4SFBUx' }}
          MAX_TICKERS: ${{ github.event.inputs.max_tickers || '80' }}
        run: node scripts/build-candidates.mjs

      - name: Commit if changed
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          if git diff --quiet data/candidates.json; then
            echo "no changes"
            exit 0
          fi
          git add data/candidates.json
          git commit -m "data: refresh 10X screener candidates [skip ci]"
          git push
